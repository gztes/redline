[project]
name = "redline"
version = "0.1.0"
description = "A local writing checker for my own recurring mistakes, with an eval that shows where it falls short."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "torch>=2.4",
    "transformers>=4.44,<5",
    "sentencepiece>=0.2",
    "sentence-transformers>=3.0",
    "keyboard>=0.13.5",
    "pyperclip>=1.9",
    "language-tool-python>=2.8",
    "install-jdk>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
redline = "redline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redline"]

[tool.uv]
link-mode = "copy"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs downloaded models (run with -m model)"]
addopts = "-m 'not model'"
